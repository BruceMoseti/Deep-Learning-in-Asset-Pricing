[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xsap"
version = "0.1.0"
description = "Machine learning and statistical inference for cross-sectional asset returns"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "xgboost>=2.1",
    "torch>=2.4",
    "matplotlib>=3.9",
    "pyarrow>=17",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 92
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The report generator is mostly long-form prose inside f-strings, where
# wrapping to the code width would break sentences across lines and make the
# generated Markdown harder to read than the source.
"scripts/07_report.py" = ["E501"]
